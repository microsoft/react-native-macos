name: prepare-ios-tests
description: Prepare iOS Tests
runs:
  using: composite
  steps:
    - name: Run Ruby Tests
      shell: bash
      run: |
        cd packages/react-native/scripts
        sh run_ruby_tests.sh
    - name: Run Hermes Ruby Tests
      shell: bash
      # The CocoaPods suite replaces Open3 with a class; isolate the real helper.
      run: ruby packages/react-native/sdks/hermes-engine/__tests__/hermes-utils-test.rb
    - name: Boot iPhone Simulator
      shell: bash
      run: source scripts/.tests.env && xcrun simctl boot "$IOS_DEVICE" || true
    - name: "Brew: Tap wix/brew"
      shell: bash
      run: brew tap wix/brew
    - name: brew install applesimutils watchman
      shell: bash
      run: brew install applesimutils watchman
    - name: Configure Watchman
      shell: bash
      run: echo "{}" > .watchmanconfig
