name: Publish to npm

on:
  push:
    branches:
      - "*-stable"
    workflow_dispatch:

# recommended: reset permissions and explicitly specify for each job
permissions: {}

# recommended: avoid concurrent runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    if: github.repository == 'microsoft/react-native-macos'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false # recommended: do not persist git credentials on disk

      - name: Setup toolchain
        uses: ./.github/actions/microsoft-setup-toolchain

      - name: Install dependencies
        run: yarn install --immutable

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    if: needs.select-mode.outputs.mode == 'version' && github.repository == 'microsoft/react-native-macos'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      version-dir-artifact-id: ${{ steps.version.outputs.version-dir-artifact-id }}
    permissions:
      contents: write # to check out repo (actions/checkout) and commit version changes (changesets/action/version)
      pull-requests: write # to create pull request (changesets/action/version)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false # recommended: do not persist git credentials on disk

      - name: Setup toolchain
        uses: ./.github/actions/microsoft-setup-toolchain

      - name: Install dependencies
        run: yarn install --immutable
  
      - name: Verify release config
        id: configure-publish
        run: node .ado/scripts/configure-publish.mts --verbose

      - name: Version packages
        id: version
        uses: changesets/action/version@v2

  publish:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    # Matches the environment name registered as a Trusted Publisher on npmjs.com.
    environment: npm-publish
    permissions:
      contents: write # to check out repo (actions/checkout) and to create releases (changesets/action/publish)
      id-token: write # for trusted publishing (changesets/action/publish)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false # recommended: do not persist git credentials on disk

      - name: Setup toolchain
        uses: ./.github/actions/microsoft-setup-toolchain

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify release config
        id: configure-publish
        run: node .ado/scripts/configure-publish.mts --verbose

      - name: Publish packages
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
        env:
          YARN_NPM_PUBLISH_ACCESS: public
          YARN_NPM_PUBLISH_REGISTRY: https://registry.npmjs.org