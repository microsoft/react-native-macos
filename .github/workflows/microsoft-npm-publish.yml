name: Publish to npm

on:
  push:
    branches:
      - "*-stable"

concurrency:
  # Serialize release lines because they share the latest and next tags.
  group: npm-publish
  # GitHub.com supports up to 100 pending runs; do not replace a release push.
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    if: github.repository == 'microsoft/react-native-macos'

    # Matches the environment name registered as a Trusted Publisher on npmjs.com.
    environment: npm-publish

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/microsoft-setup-toolchain
        with:
          node-version: "22"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify release config
        id: configure-publish
        run: node .ado/scripts/configure-publish.mts --verbose

      - name: Publish packages
        if: steps.configure-publish.outputs.publish_react_native_macos == '1'
        run: |
          yarn workspaces foreach -vv --all --topological --no-private npm publish \
            --provenance \
            --tag "${{ steps.configure-publish.outputs.publishTag }}" \
            --tolerate-republish
        env:
          YARN_NPM_PUBLISH_ACCESS: public
          YARN_NPM_PUBLISH_REGISTRY: https://registry.npmjs.org
