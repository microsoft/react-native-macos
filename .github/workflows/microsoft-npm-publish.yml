name: Publish to npm

on:
  push:
    branches:
      - "*-stable"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    if: github.repository == 'microsoft/react-native-macos'

    # Matches the environment name registered as a Trusted Publisher on npmjs.com.
    environment: npm-publish

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/microsoft-setup-toolchain
        with:
          node-version: "22"

      - name: Install dependencies
        run: yarn install --immutable

      # Determine whether this branch/version should be published and, if so,
      # which dist-tag(s) to use.  Outputs:
      #   publish_react_native_macos – '1' when publishing should proceed
      #   publishTag                 – primary npm dist-tag (e.g. 'latest')
      #   additionalTags             – extra tags to apply (e.g. 'next', may be empty)
      - name: Verify release config
        id: configure-publish
        run: node .ado/scripts/configure-publish.mts --verbose --skip-auth

      - name: Configure yarn for npm publishing
        if: steps.configure-publish.outputs.publish_react_native_macos == '1'
        run: |
          yarn config set npmPublishAccess public
          yarn config set npmPublishRegistry "https://registry.npmjs.org"

      - name: Publish packages
        if: steps.configure-publish.outputs.publish_react_native_macos == '1'
        run: |
          yarn workspaces foreach -vv --all --topological --no-private npm publish \
            --provenance \
            --tag "${{ steps.configure-publish.outputs.publishTag }}" \
            --tolerate-republish

      # npm dist-tag add doesn't support OIDC, so NODE_AUTH_TOKEN (a granular
      # NPM_TOKEN secret) is still required for this step.
      - name: Apply additional dist-tags
        if: >-
          steps.configure-publish.outputs.publish_react_native_macos == '1' &&
          steps.configure-publish.outputs.additionalTags != ''
        run: |
          node .ado/scripts/apply-additional-tags.mjs \
            --tags "${{ steps.configure-publish.outputs.additionalTags }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
